<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVU Revision Email Writer</title>
<style>
  :root {
    --bg: #eef1f6;
    --bg-accent: #e4e9f4;
    --panel: #ffffff;
    --border: #dde1e9;
    --border-soft: #e8eaf0;
    --text: #1a1d29;
    --muted: #6b7280;
    --accent: #3357e0;
    --accent-hover: #2846c2;
    --accent-soft: #eaefff;
    --danger: #dc2626;
    --readout-bg: #f7f8fb;
    --shadow: 0 1px 2px rgba(20, 24, 40, 0.04), 0 8px 24px -12px rgba(20, 24, 40, 0.10);
    --shadow-sm: 0 1px 2px rgba(20, 24, 40, 0.06);
    --ring: 0 0 0 3px rgba(51, 87, 224, 0.15);
  }
  [data-theme="dark"] {
    --bg: #12141a;
    --bg-accent: #171a22;
    --panel: #1b1e27;
    --border: #2d313d;
    --border-soft: #262a34;
    --text: #edeef2;
    --muted: #8b91a1;
    --accent: #6b8cf5;
    --accent-hover: #85a0f7;
    --accent-soft: #232a43;
    --danger: #f87171;
    --readout-bg: #20232c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 12px 28px -14px rgba(0, 0, 0, 0.55);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --ring: 0 0 0 3px rgba(107, 140, 245, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(1200px 480px at 12% -8%, var(--bg-accent), transparent),
      var(--bg);
    color: var(--text);
    padding: 32px 24px;
    transition: background 0.15s ease, color 0.15s ease;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 920px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 800px) {
    .wrap { grid-template-columns: 1fr; }
  }
  h1 {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    grid-column: 1 / -1;
  }
  .sub {
    font-size: 13.5px;
    color: var(--muted);
    margin: 0 0 4px;
    grid-column: 1 / -1;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
    font-family: inherit;
    background: var(--readout-bg);
    color: var(--text);
    transition: border-color 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: var(--ring);
    background: var(--panel);
  }
  .select-wrap {
    position: relative;
    margin-bottom: 4px;
  }
  select#appType {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    padding: 10px 38px 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    background: var(--readout-bg);
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  }
  select#appType:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: var(--ring);
    background: var(--panel);
  }
  .select-wrap::after {
    content: '';
    position: absolute;
    right: 14px;
    top: 50%;
    width: 8px;
    height: 8px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }
  .bullets-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .bullets-title span {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .bullet-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    align-items: flex-start;
  }
  .bullet-row input {
    margin-bottom: 0;
  }
  .icon-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 36px;
    min-width: 36px;
    height: 38px;
    cursor: pointer;
    font-size: 16px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .icon-btn:hover { background: var(--readout-bg); color: var(--danger); border-color: var(--danger); }
  .add-btn {
    width: 100%;
    padding: 9px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    margin-top: 2px;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .bullet-row textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: var(--readout-bg);
    color: var(--text);
    resize: none;
    overflow: hidden;
    min-height: 40px;
    line-height: 1.4;
    transition: border-color 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  }
  .bullet-row textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: var(--ring);
    background: var(--panel);
  }
  .add-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .out-panel {
    grid-column: 1 / -1;
  }
  .out-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .out-row h2 {
    font-size: 14.5px;
    font-weight: 700;
    margin: 0;
  }
  .copy-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: background 0.12s ease, transform 0.06s ease;
  }
  .copy-btn:hover { background: var(--accent-hover); }
  .copy-btn:active { transform: translateY(1px); }
  .copy-btn.copied { background: #16a34a; }
  .field-block {
    margin-bottom: 14px;
  }
  .field-block label {
    margin-bottom: 4px;
  }
  .readout {
    background: var(--readout-bg);
    border: 1px solid var(--border);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13.5px;
    font-family: "SF Mono", Consolas, Menlo, monospace;
    color: var(--text);
  }
  textarea#emailOutput {
    width: 100%;
    min-height: 340px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    resize: vertical;
    color: var(--text);
    background: var(--readout-bg);
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  textarea#emailOutput:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: var(--ring);
  }
  .theme-toggle {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: var(--shadow-sm);
    transition: background 0.12s ease;
  }
  .theme-toggle:hover { background: var(--readout-bg); }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    grid-column: 1 / -1;
    margin-bottom: 6px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div>
      <h1>CVU Revision Email Writer</h1>
      <p class="sub">Fill in the applicant details and findings, then copy the subject and body.</p>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button">🌙 Dark mode</button>
  </div>

  <div class="panel">
    <label for="applicantName">Applicant Name</label>
    <input type="text" id="applicantName" placeholder="e.g. John Michael Doe">

    <label for="passportNumber">Passport Number</label>
    <input type="text" id="passportNumber" placeholder="e.g. P1234567">

    <label for="salutation">Salutation / Title (e.g. Mr., Ms., Dr.)</label>
    <input type="text" id="salutation" placeholder="e.g. Mr.">

    <label for="appType">Application Type</label>
    <div class="select-wrap">
      <select id="appType"></select>
    </div>
  </div>

  <div class="panel">
    <div class="bullets-title">
      <span>Findings (bullet points)</span>
    </div>
    <div id="bulletsContainer"></div>
    <button class="add-btn" id="addBulletBtn" type="button">+ Add finding</button>
  </div>

  <div class="panel out-panel">
    <div class="field-block">
      <label>Subject Line</label>
      <div class="readout" id="subjectReadout">Subject will appear here</div>
    </div>
    <div style="margin-bottom:14px; display:flex; justify-content:flex-end;">
      <button class="copy-btn" id="copySubjectBtn" type="button">Copy Subject</button>
    </div>
    <div class="out-row">
      <h2>Email Body</h2>
      <button class="copy-btn" id="copyBodyBtn" type="button">Copy Body</button>
    </div>
    <textarea id="emailOutput" readonly></textarea>
  </div>
</div>

<script>
  const bulletsContainer = document.getElementById('bulletsContainer');
  const addBulletBtn = document.getElementById('addBulletBtn');
  const applicantName = document.getElementById('applicantName');
  const passportNumber = document.getElementById('passportNumber');
  const salutation = document.getElementById('salutation');
  const subjectReadout = document.getElementById('subjectReadout');
  const emailOutput = document.getElementById('emailOutput');
  const copyBodyBtn = document.getElementById('copyBodyBtn');
  const copySubjectBtn = document.getElementById('copySubjectBtn');
  const appTypeSelect = document.getElementById('appType');

  const APP_TYPES = [
    { value: 'sport', label: 'Sport', link: 'https://identita.gov.mt/wp-content/uploads/2025/07/12.-Sports-Trials-Checklist.pdf' },
    { value: 'student', label: 'Student', link: 'https://identita.gov.mt/wp-content/uploads/2025/08/03a.-List-of-Required-Documents-Student_National_Visa.pdf' },
    { value: 'employment', label: 'Employment', link: 'https://identita.gov.mt/wp-content/uploads/2025/06/01.-List-of-Required-Documents-EMPLOYMENT-VISA.pdf' },
    { value: 'citizenship', label: 'Citizenship', link: 'https://identita.gov.mt/wp-content/uploads/2024/12/Documentation-required-for-citizenship-residence-programmes.pdf' },
    { value: 'tempEmployment', label: 'Temporary Employment', link: 'https://identita.gov.mt/wp-content/uploads/2024/12/Documentation-required-for-Temporary-Employment-in-Malta.pdf' },
    { value: 'longTermNonTourism', label: 'Long Term Non-Tourism', link: 'https://identita.gov.mt/wp-content/uploads/2024/12/Documentation-required-for-long-term_non-tourism.pdf' }
  ];

  const CHECKLIST_LINKS = Object.fromEntries(APP_TYPES.map(t => [t.value, t.link]));

  APP_TYPES.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.value;
    opt.textContent = t.label;
    appTypeSelect.appendChild(opt);
  });

  function getAppType() {
    return appTypeSelect.value;
  }

  // Findings are intentionally left untouched when the application type changes.
  appTypeSelect.addEventListener('change', render);

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function createBulletRow(value = '') {
    const row = document.createElement('div');
    row.className = 'bullet-row';

    const input = document.createElement('textarea');
    input.rows = 1;
    input.placeholder = 'Describe the issue found...';
    input.value = value;
    input.addEventListener('input', () => {
      autoResize(input);
      render();
    });

    const removeBtn = document.createElement('button');
    removeBtn.className = 'icon-btn';
    removeBtn.type = 'button';
    removeBtn.innerHTML = '&times;';
    removeBtn.title = 'Remove';
    removeBtn.addEventListener('click', () => {
      row.remove();
      render();
    });

    row.appendChild(input);
    row.appendChild(removeBtn);
    requestAnimationFrame(() => autoResize(input));
    return row;
  }

  function addBullet(value = '') {
    bulletsContainer.appendChild(createBulletRow(value));
  }

  addBulletBtn.addEventListener('click', () => {
    addBullet();
    render();
  });

  // Start with 4 bullet rows to match the template
  for (let i = 0; i < 4; i++) addBullet();

  function getBulletValues() {
    return Array.from(bulletsContainer.querySelectorAll('textarea'))
      .map(i => i.value.trim())
      .filter(v => v.length > 0);
  }

  function buildSubject() {
    const name = applicantName.value.trim();
    const passport = passportNumber.value.trim();
    if (!name && !passport) return '';
    let subj = 'Visa Application Revision Required';
    if (name) subj += ` – ${name}`;
    if (passport) subj += ` (Passport No. ${passport})`;
    return subj;
  }

  function buildBody() {
    const name = applicantName.value.trim();
    const title = salutation.value.trim();
    let greeting;
    if (title && name) {
      greeting = `${title} ${name}`;
    } else if (name) {
      greeting = name;
    } else if (title) {
      greeting = title;
    } else {
      greeting = 'XXXXXXXX';
    }
    const bullets = getBulletValues();
    const bulletText = bullets.length
      ? bullets.map(b => `* ${b}`).join('\n\n \n\n')
      : '* XXXXXXXX \n\n \n\n* XXXXXXXX \n\n \n\n* XXXXXXXX \n\n \n\n* XXXXXXXX';

    const link = CHECKLIST_LINKS[getAppType()];
    const appType = getAppType();
    const subjectReminder = appType === 'employment'
      ? '\n\nAny correspondence should include name and passport number of applicant in the subject.'
      : '';

    return `Dear ${greeting},

Whilst reviewing your application it was noted that:

${bulletText}

Kindly provide us with a revised document that meets CVU's checklist requirements as found on the following link ${link}

Your feedback is required within five working days from the date of this email. Kindly note that no reminders will be sent and that no further revisions will be allowed.

If you fail to provide the necessary requested information within this timeframe, your visa application outcome will be negatively impacted.${subjectReminder}

Kind Regards,`;
  }

  function render() {
    const subject = buildSubject();
    subjectReadout.textContent = subject || 'Subject will appear here';
    emailOutput.value = buildBody();
  }

  [applicantName, passportNumber, salutation].forEach(el => el.addEventListener('input', render));

  function flashCopied(btn) {
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1200);
  }

  copyBodyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(emailOutput.value).then(() => flashCopied(copyBodyBtn));
  });

  copySubjectBtn.addEventListener('click', () => {
    const subj = buildSubject();
    if (!subj) return;
    navigator.clipboard.writeText(subj).then(() => flashCopied(copySubjectBtn));
  });

  render();

  // Theme toggle
  const themeToggle = document.getElementById('themeToggle');
  const rootEl = document.documentElement;
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

  function applyTheme(isDark) {
    if (isDark) {
      rootEl.setAttribute('data-theme', 'dark');
      themeToggle.textContent = '☀️ Light mode';
    } else {
      rootEl.removeAttribute('data-theme');
      themeToggle.textContent = '🌙 Dark mode';
    }
  }

  let isDark = prefersDark;
  applyTheme(isDark);

  themeToggle.addEventListener('click', () => {
    isDark = !isDark;
    applyTheme(isDark);
  });
</script>
</body>
</html>
